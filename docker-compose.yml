services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: minion_assist
      POSTGRES_USER: minion
      POSTGRES_PASSWORD: minion
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - E:\AI\Projects\OpenMinds\Minions\Minion-Assist\data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minion -d minion_assist"]
      interval: 5s
      timeout: 5s
      retries: 5

