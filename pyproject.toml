[project]
name = "mini-minion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
tiktoken  = ["tiktoken>=0.7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
mini-minion = "mini_minion.minion:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_minion"]
