[project]
name = "minion-assist"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "matrix-nio>=0.25.2",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
tiktoken  = ["tiktoken>=0.7.0"]
matrix    = ["matrix-nio[e2e]>=0.21", "aiosqlite>=0.19"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
minion-assist = "minion_assist.minion:main"
codex-login = "minion_assist.auth.codex_auth:_cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/minion_assist"]
